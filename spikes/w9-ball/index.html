<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#bceef2">
<meta name="robots" content="noindex,nofollow">
<title>Ball Runner — W9.4 Physics Lab</title>
</head>
<body>
<main id="game" aria-label="Physics Ball Runner playable prototype">
  <canvas id="application-canvas" aria-label="Physics-powered rolling ball"></canvas>
  <div id="hud">
    <header><div><small>GAME FACTORY / W9.4</small><strong>BALL RUNNER</strong>
      <span id="level-name" aria-live="polite"></span></div>
      <div class="score"><span id="coins">0</span><small id="gem-label"> / 6 GEMS</small></div></header>
    <div class="progress"><div id="progress"></div></div>
    <div class="status" id="status">Loading real physics…</div>
    <div id="message" aria-live="polite"></div>
    <section id="dialog" class="dialog">
      <div class="eyebrow">PLAYABLE PHYSICS PROTOTYPE</div>
      <h1 id="dialog-title">ROLL WITH <em>FEEL.</em></h1>
      <p id="dialog-description">Guide a real physics ball across the toy course. Dodge bumpers, collect gems, stay on track.</p>
      <button type="button" id="start" disabled>LOADING…</button>
      <small class="foot">Swipe or drag to steer · Space to start/retry</small>
    </section>
    <div class="hint">← DRAG TO STEER →</div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
