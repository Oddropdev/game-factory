<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#89c8fe">
<meta name="robots" content="noindex,nofollow">
<title>Mass Runner 3D — W9.2D PlayCanvas Hero</title>
</head>
<body>
<main id="game" aria-label="Mass Runner 3D interactive hero slice">
  <canvas id="application-canvas" aria-label="3D Mass Runner course"></canvas>
  <div id="hud" aria-live="polite">
    <header>
      <div class="brand"><small>GAME FACTORY / PLAYCANVAS</small><strong>MASS RUNNER <span>3D</span></strong></div>
      <div class="level-pill">LEVEL <b id="level">01</b><span> / 05</span></div>
    </header>
    <div class="top-progress"><div id="progress"></div></div>
    <div class="numbers"><div class="mass-box"><small>CURRENT MASS</small><strong id="mass">4</strong><span> / <span id="target">12</span> TARGET</span></div><div class="score-box"><small>SCORE</small><strong id="score">0000</strong></div></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <section id="dialog" class="dialog">
      <div class="eyebrow">ONE-LEVEL PRODUCTION TEST</div>
      <h1 id="dialog-title">GROW BIG.<br><em>GO FAST.</em></h1>
      <p id="dialog-description">Swipe sideways to collect coins, dodge obstacles and choose the better gate.</p>
      <button id="start" type="button">START RUN <span aria-hidden="true">→</span></button>
      <div class="sub-note">W9.2D · PLAYCANVAS + REAL CC0 GAME ART</div>
    </section>
    <div id="steer-hint">← DRAG TO STEER →</div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
