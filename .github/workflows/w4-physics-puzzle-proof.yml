name: W4 Physics Puzzle Proof

on:
  pull_request:
    paths:
      - ".github/workflows/w4-physics-puzzle-proof.yml"
      - "docs/architecture/W4-PHYSICS-PUZZLE-PROOF-CONTRACT.md"
      - "docs/evidence/W4-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'w4-physics-puzzle-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      W4_BASE_SHA: 6c98ca776f93d0b7609253ae4ceb16f296a3c30a

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify accepted physics regression
        run: npm run verify

      - name: Verify historical W4 New Game Core Churn
        run: node tools/check-w4-core-churn.mjs

      - name: Upload W4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w4-physics-puzzle-evidence
          path: |
            evidence/w1/
            evidence/w2/
            evidence/w3/
            evidence/w4/
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: warn
