name: W2 Runner Proof

on:
  pull_request:
    paths:
      - "src/games/runner/**"
      - "tests/unit/runnerModel.test.ts"
      - "tests/e2e/runner.spec.ts"
      - "tools/check-w2-core-churn.mjs"
      - ".github/workflows/w2-runner-proof.yml"
      - "docs/architecture/W2-RUNNER-PROOF-CONTRACT.md"
      - "docs/evidence/W2-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      W2_BASE_SHA: 3da4311757703ba7d34627541e7234819f3c5565

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify W1 regression + W2 runner
        run: npm run verify

      - name: Verify historical W2 New Game Core Churn
        if: github.event_name == 'pull_request' && github.head_ref == 'w2-runner-proof'
        run: npm run check:w2-core-churn

      - name: Upload W2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-runner-evidence
          path: |
            evidence/w1/
            evidence/w2/
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: warn
