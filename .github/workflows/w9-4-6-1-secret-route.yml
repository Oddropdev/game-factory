name: W9.4-6.1 Secret Grind Traversal
on:
  pull_request:
    paths:
      - "spikes/w9-ball/src/main.ts"
      - "spikes/w9-ball/src/RailModes.ts"
      - "spikes/w9-ball/src/GrindTrack.ts"
      - "tests/ball/w9-4-6-1-secret-route.spec.mjs"
      - "docs/evidence/W9.4-6.1*"
      - ".github/workflows/w9-4-6-1-secret-route.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secret-route:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref,'w9-4-6-1-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Typecheck and isolated nonlicensed build
        run: |
          npm run typecheck
          npm run build:w9-4:ball
      - name: Real user-input secret route over elevated top-only rail
        run: npx playwright test tests/ball/w9-4-6-1-secret-route.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Accepted bridge and guard physics regressions
        run: npx playwright test tests/ball/w9-4-6-guard-grind.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9-4-6-1-secret-route-evidence
          path: |
            evidence/w9-4-6-1/
            test-results/
          if-no-files-found: warn
