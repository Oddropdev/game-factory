name: W0 Skeleton Hunt

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Search profile"
        required: false
        default: "general"
        type: choice
        options:
          - general
          - patterns
      per_query:
        description: "Candidates requested per search query"
        required: false
        default: "12"
      max_candidates:
        description: "Maximum deduplicated candidate count"
        required: false
        default: "80"
      concurrency:
        description: "Concurrent metadata enrichment workers"
        required: false
        default: "8"
  pull_request:
    paths:
      - "tools/skeleton-hunt/**"
      - ".github/workflows/w0-skeleton-hunt.yml"

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Syntax check
        run: npm run hunt:check

      - name: Discover and preliminarily score candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUNT_PROFILE: ${{ inputs.profile || 'general' }}
          HUNT_PER_QUERY: ${{ inputs.per_query || '12' }}
          HUNT_MAX_CANDIDATES: ${{ inputs.max_candidates || '80' }}
          HUNT_CONCURRENCY: ${{ inputs.concurrency || '8' }}
        run: npm run hunt

      - uses: actions/upload-artifact@v4
        with:
          name: w0-skeleton-hunt
          path: research/generated/
          if-no-files-found: error
