name: W1 Factory Foundation

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "tools/check-artifact.mjs"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "eslint.config.js"
      - "playwright.config.ts"
      - ".github/workflows/w1-foundation.yml"
      - "docs/architecture/W1-FOUNDATION-CONTRACT.md"
      - "docs/evidence/W1-FOUNDATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify W1 foundation
        run: npm run verify

      - name: Upload W1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1-foundation-evidence
          path: |
            evidence/w1/
            playwright-report/
            package-lock.json
          if-no-files-found: warn
