name: W7 First Real Game

on:
  pull_request:
    paths:
      - "src/games/mass-runner/**"
      - "src/factory/GameRegistry.ts"
      - "tests/unit/massRunnerModel.test.ts"
      - "tests/e2e/mass-runner.spec.ts"
      - "tools/check-w7-real-game.mjs"
      - "package.json"
      - ".github/workflows/w7-first-real-game.yml"
      - "docs/architecture/W7-FIRST-REAL-GAME-CONTRACT.md"
      - "docs/evidence/W7-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W7_BASE_SHA: 8c8f4a7df201780ad50479454be8c3aed7cb5124

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify factory, distributions and first real game
        run: npm run verify

      - name: Verify W7 real-game contract
        run: npm run check:w7-real-game

      - name: Upload W7 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w7-first-real-game-evidence
          path: |
            evidence/w1/
            evidence/w6/
            evidence/w7/
            dist-platforms/
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: warn
