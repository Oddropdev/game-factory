name: W9.4-4 Real Long Jump and Landing
on:
  pull_request:
    paths:
      - "spikes/w9-ball/src/main.ts"
      - "spikes/w9-ball/src/LongJumpCourse.ts"
      - "tests/ball/w9-4-long-jump.spec.mjs"
      - "tools/check-w9-4-4.mjs"
      - "docs/evidence/W9.4-4*"
      - ".github/workflows/w9-4-long-jump.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'w9-4-4-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      W9_4_4_BASE_SHA: e247c892e7cc56a86fab13c2301fbbf01bacea6f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Accepted Factory regression
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Build new opt-in jump route with self-hosted Ammo
        run: npm run build:w9-4:ball
      - name: Original ball, licensed-art fallback and W9.4-3 speed regressions
        run: npx playwright test tests/ball/w9-4-physics.spec.mjs tests/ball/w9-4-private-art.spec.mjs tests/ball/w9-4-sky-speed.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Actual 440m air jump, landing collision, speed and screenshot tests
        run: npx playwright test tests/ball/w9-4-long-jump.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Frozen-churn and evidence scope audit
        run: node tools/check-w9-4-4.mjs
      - name: Archive build and browser evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9-4-4-real-jump-evidence
          path: |
            playtest-dist/ball/
            evidence/w9-4-4/
            test-results/
          if-no-files-found: warn
