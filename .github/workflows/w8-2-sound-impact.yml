name: W8.2 Sound and Impact Tuning

on:
  pull_request:
    paths:
      - "src/games/mass-runner/**"
      - "src/main.ts"
      - "src/factory/GameModule.ts"
      - "tests/unit/massRunnerAudio.test.ts"
      - "tests/feel/**"
      - "tools/check-w8-sound.mjs"
      - "package.json"
      - ".github/workflows/w8-2-sound-impact.yml"
      - "docs/architecture/W8.2-SOUND-CONTRACT.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'w8-2-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W8_BASE_SHA: 4b19ec9d83f7fe4ce72fec84101066d7573a70e2

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accepted factory and game verification
        run: npm run verify

      - name: Check W8.2 sound boundary and protected churn
        run: npm run check:w8-sound

      - name: Run muted A/B captures and live sound platform tests
        run: npm run test:w8-feel

      - name: Upload W8.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-2-sound-impact-evidence
          path: |
            evidence/w1/
            evidence/w6/
            evidence/w7/
            evidence/w8/
            test-results/
            playwright-report/
          if-no-files-found: warn
