name: W9.4-6 Guard Lock and Top-only Grind
on:
  pull_request:
    paths:
      - "spikes/w9-ball/src/main.ts"
      - "spikes/w9-ball/src/RailModes.ts"
      - "spikes/w9-ball/src/GrindTrack.ts"
      - "spikes/w9-ball/src/LongJumpCourse.ts"
      - "tests/ball/w9-4-6-guard-grind.spec.mjs"
      - "docs/evidence/W9.4-6*"
      - ".github/workflows/w9-4-6-guard-grind.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-grind:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref,'w9-4-6-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Dependencies
        run: npm install --no-audit --no-fund
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Factory typecheck lint unit test
        run: |
          npm run typecheck
          npm run lint
          npm run test
      - name: Isolated ball build without private files
        run: npm run build:w9-4:ball
      - name: Distinct guard and grind physics / authentic browser screenshots
        run: npx playwright test tests/ball/w9-4-6-guard-grind.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Existing ball sky jump magnetic and rail-priority regressions
        run: npx playwright test tests/ball/w9-4-physics.spec.mjs tests/ball/w9-4-private-art.spec.mjs tests/ball/w9-4-sky-speed.spec.mjs tests/ball/w9-4-long-jump.spec.mjs tests/ball/w9-4-magnetic-rails.spec.mjs tests/ball/w9-4-rail-priority.spec.mjs --config=playwright.w9-4.config.mjs
      - name: Save private-preview-ready source-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w9-4-6-guard-grind-evidence
          path: |
            playtest-dist/ball/
            evidence/w9-4-6/
            test-results/
          if-no-files-found: warn
