name: W6 Distribution Adapters

on:
  pull_request:
    paths:
      - "src/platform/**"
      - "src/runtime/LifecycleRuntime.ts"
      - "src/testing/TestBridge.ts"
      - "src/main.ts"
      - "tests/unit/platformFactory.test.ts"
      - "tests/e2e/distribution.spec.ts"
      - "tools/build-distributions.mjs"
      - "tools/check-w6-distribution.mjs"
      - "package.json"
      - ".github/workflows/w6-distribution-adapters.yml"
      - "docs/architecture/W6-DISTRIBUTION-ADAPTERS-CONTRACT.md"
      - "docs/evidence/W6-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify accepted gameplay and all distribution adapters
        run: npm run verify

      - name: Upload W6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w6-distribution-adapters-evidence
          path: |
            evidence/w1/
            evidence/w2/
            evidence/w3/
            evidence/w4/
            evidence/w5/
            evidence/w6/
            dist-platforms/
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: warn
