name: W5 Factory Extraction

on:
  pull_request:
    paths:
      - "src/factory/**"
      - "src/runtime/ViewportRuntime.ts"
      - "src/games/runner/RunnerGame.ts"
      - "src/games/collector/CollectorGame.ts"
      - "src/games/physics/PhysicsGame.ts"
      - "src/main.ts"
      - "tests/**"
      - "tools/check-w5-extraction.mjs"
      - "tools/check-artifact.mjs"
      - "package.json"
      - ".github/workflows/w5-factory-extraction.yml"
      - "docs/architecture/W5-FACTORY-EXTRACTION-CONTRACT.md"
      - "docs/evidence/W5-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify all accepted game families after extraction
        run: npm run verify

      - name: Verify W5 extraction contract
        run: npm run check:w5-extraction

      - name: Upload W5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w5-factory-extraction-evidence
          path: |
            evidence/w1/
            evidence/w2/
            evidence/w3/
            evidence/w4/
            evidence/w5/
            playwright-report/
            test-results/
            package-lock.json
          if-no-files-found: warn
