name: W8.1 Reference Mining Hero Slice

on:
  pull_request:
    paths:
      - "src/games/mass-runner/**"
      - "tests/unit/massRunnerPresentation.test.ts"
      - "tests/feel/**"
      - "playwright.w8.config.ts"
      - "tools/check-w8-hero.mjs"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/w8-1-hero-slice.yml"
      - ".github/workflows/w7-first-real-game.yml"
      - "docs/research/W8.1-REFERENCE-MINING.md"
      - "docs/architecture/W8.1-HERO-SLICE-CONTRACT.md"
      - "docs/evidence/W8.1-**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'w8-1-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      W8_BASE_SHA: ef80ff82ddaae5a36921e7fc16236e52908a8711

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify accepted factory and Mass Runner
        run: npm run verify

      - name: Verify W8.1 hero-slice contract
        run: npm run check:w8-hero

      - name: Capture baseline vs polished hero videos
        run: npm run test:w8-feel

      - name: Upload W8.1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w8-1-hero-slice-evidence
          path: |
            evidence/w1/
            evidence/w6/
            evidence/w7/
            evidence/w8/
            test-results/
            playwright-report/
            package-lock.json
          if-no-files-found: warn
