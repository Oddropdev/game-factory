name: W10 True Spiral and Manual Physics
on:
  push:
    branches: [w10-0-true-spiral-manual-physics]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: w10-true-spiral
  cancel-in-progress: true
jobs:
  verify:
    name: Compile, 1000 spirals and real physical no-AFK browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build:w9-5:public
      - run: npm run check:w9-5:public
      - run: npx playwright install --with-deps chromium
      - name: W9.9 baseline unchanged 6-world run
        run: npx playwright test --config=playwright.w9-9.config.mjs
      - name: Real physical 360 helix and input/AFK isolation
        run: npx playwright test --config=playwright.w10.config.mjs
      - name: Prepare public Pages payload only after all green
        run: |
          set -euo pipefail
          mkdir -p public-site/ball
          cp -a playtest-dist/ball/. public-site/ball/
          touch public-site/.nojekyll
          cat >public-site/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta http-equiv="refresh" content="0;url=./ball/?mode=endless">
          <title>Prism Run</title></head><body><a href="./ball/?mode=endless">Play Prism Run</a></body></html>
          HTML
          test -s public-site/ball/index.html
          test -s public-site/ball/ammo/ammo.wasm.wasm
          if find public-site -type f \( -iname '*.glb' -o -iname '*.zip' \) | grep .; then
            echo "Private model in public artifact";exit 1
          fi
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w10-spiral-evidence
          path: |
            test-results/w10-*
            test-results/w99-*
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site/
  publish:
    name: Deploy isolated W10 mobile route after proof
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: w10-spiral-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
